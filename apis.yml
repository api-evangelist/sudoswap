apis:
  - name: Sudoswap Smart Contract API
    description: >-
      On-chain smart contract interface for the Sudoswap AMM protocol.
      Developers interact with LSSVMPairFactory to create pools, with
      LSSVMPair contracts to deposit/withdraw assets, and with VeryFastRouter
      to execute NFT-to-token and NFT-to-NFT swaps across multiple pairs.
      Bonding curve contracts (Linear, Exponential, XYK, GDA) expose
      getBuyInfo() and getSellInfo() for pricing queries.
    image: https://sudoswap.xyz/favicon.ico
