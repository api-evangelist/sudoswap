  - name: Sudoswap SDK (sudo-defined-quoter)
    description: >-
      TypeScript/JavaScript SDK published on npm as sudo-defined-quoter that
      wraps the Defined (formerly Codex) API to retrieve bid and ask quotes for
      any NFT collection across multiple EVM chains. Provides getBidQuotes()
      and getAskQuotes() methods returning pool addresses, spot prices, and
      calculated quotes. Requires a Defined API key.
