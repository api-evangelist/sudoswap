name: Sudoswap
description: >-
  Sudoswap is a minimal, gas-efficient automated market maker (AMM) protocol
  for NFTs that facilitates NFT-to-token swaps using customizable bonding
  curves. It supports ERC-721 and ERC-1155 NFTs alongside ETH and ERC-20
  tokens. Liquidity providers can create single-sided buy/sell pools or
  dual-sided trade pools to earn fees. Developers interact with the protocol
  through smart contracts (LSSVMPair, VeryFastRouter, bonding curve contracts)
  and off-chain indexing services such as The Graph subgraph and the
  Defined/Codex data API. Sudoswap v2 is deployed on Ethereum mainnet,
  Arbitrum, Base, Berachain, Sanko, and other EVM-compatible networks.
